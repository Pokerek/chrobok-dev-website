name: inspect

on:
  pull_request:
    branches: [development]

permissions:
  contents: read

jobs:
  # The job is named `ci`: the dev-flow plugin merges a PR only after a check named `ci` passed.
  # No build step: Vercel's preview build runs `yarn build` (astro check + build) on every PR commit,
  # and its status gates the merge as well.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - run: yarn lint
